<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Hitokoto の設定</title>
<link rel="icon" href="icons/32.png">
<style>
  :root { color-scheme: light dark; --accent: #E5483B; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; word-break: auto-phrase;
         background: light-dark(#f6f5f3, #1c1c1e); color: light-dark(#222, #e8e8e8); }
  form { width: min(640px, 90vw); display: grid; gap: 20px; text-align: center; }
  img { width: 88px; margin: 0 auto -8px; }
  h1 { margin: 0; font-size: 32px; }
  p { margin: 0; color: light-dark(#666, #aaa); text-wrap: balance; }
  a { color: inherit; white-space: nowrap; }
  #key { font: 22px/1.4 ui-monospace, monospace; padding: 20px 24px; border-radius: 18px; outline: none; color: inherit;
          border: 1px solid light-dark(#0002, #fff3); background: light-dark(#fff, #2a2a2c); }
  #key:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  section { text-align: left; font-size: 14px; padding: 16px 20px; border-radius: 18px; background: light-dark(#0000000a, #ffffff0d); }
  ul { margin: 0 0 12px; padding-left: 1.2em; color: light-dark(#555, #bbb); }
  label { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
  label input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  button { font: 600 18px/1 system-ui, sans-serif; padding: 18px; border: 0; border-radius: 18px; color: #fff;
           background: var(--accent); cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  #status { min-height: 1.6em; color: var(--accent); }
</style>
<form id="form">
  <img src="icons/128.png" alt="">
  <h1>Hitokoto</h1>
  <p>Claude か OpenAI の API キーを入れてください。<br>キーは <a href="https://platform.claude.com/" target="_blank">Claude Console</a> か <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI Platform</a> で作れます。</p>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off" autofocus>
  <section>
    <ul>
      <li>アイコンを押したときだけ、選んでいる語を API キーの会社（Anthropic か OpenAI）に送り、意味を答えさせます。</li>
      <li>ページのほかの文や閲覧履歴は送りません。</li>
      <li>API キーはこのブラウザの中だけに保存し、開発者には何も送りません。</li>
    </ul>
    <label><input id="consent" type="checkbox" required><span>上の内容に同意します（<a href="https://github.com/4rtoflow/Hitokoto/blob/main/PRIVACY.md" target="_blank">プライバシーポリシー</a>）</span></label>
  </section>
  <button>保存</button>
  <p id="status"></p>
</form>
<script src="options.js"></script>
